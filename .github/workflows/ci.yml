name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 关卡 1：仓库卫生。中间产物、密钥、超大文件一律红灯。
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查禁止入库的文件与密钥
        run: python scripts/check_repo.py

  # 关卡 2：单元测试。没有 tests/ 时跳过，不阻塞文档类 PR。
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 判断是否存在测试
        id: probe
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' -print -quit)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 安装依赖
        if: steps.probe.outputs.found == 'true'
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          pip install pytest pytest-cov
      - name: 运行单元测试
        if: steps.probe.outputs.found == 'true'
        run: pytest -q --cov=src --cov-report=term-missing
      - name: 无测试则跳过
        if: steps.probe.outputs.found == 'false'
        run: echo "tests/ 下暂无 test_*.py，跳过（v0.1 起必须补齐）"
